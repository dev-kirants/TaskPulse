<style>
:root{--bg:#eceff3;--panel:#fff;--ink:#17222e;--mute:#667585;--line:#d5dbe3;--acc:#1f4fd8;--accsoft:#e3eafc;--ok:#13795b;--warn:#b7791f;--bad:#c0392b;--okbg:#dff3ec;--warnbg:#fbefd5;--badbg:#f9e0dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--panel:#18212b;--ink:#e6ebf1;--mute:#8a98a8;--line:#2b3744;--acc:#7b9cff;--accsoft:#22314f;--ok:#4fcba4;--warn:#e5b34f;--bad:#ef7f71;--okbg:#17352c;--warnbg:#3a2f17;--badbg:#3d1f1b;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
aside h1{font-size:19px;margin:0 6px 10px;letter-spacing:-.02em;display:flex;align-items:center}.lm{width:34px;height:auto;margin-right:9px}.lm2{width:84px;display:block;margin-bottom:12px}
.home{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;font-weight:600}
.home.on{background:var(--accsoft)}
main{padding:28px clamp(16px,4vw,44px);max-width:1100px;width:100%}
h2{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
h3{font-size:16px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 22px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.m{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.m span{color:var(--mute);font-size:13px}.m b{display:block;font-size:28px;font-weight:600;letter-spacing:-.02em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pc{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.pcw{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.pcw:hover{border-color:var(--acc)}.pcw .pc{border:0;border-radius:0;background:none;width:100%;color:inherit}.pls{padding:0 16px 14px;display:flex;flex-wrap:wrap;gap:6px}.pls a{font-size:13px;font-weight:600;color:var(--acc);background:var(--accsoft);padding:3px 10px;border-radius:99px;text-decoration:none}.pls a:hover{text-decoration:underline}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--acc)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.n{background:var(--bg);color:var(--mute)}
.track{display:flex;overflow-x:auto;padding:6px 2px 4px}
.st{flex:1;min-width:110px;background:none;border:0;text-align:center;position:relative;padding:0 4px}
.st:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line)}
.st:first-child:before{display:none}.st.done:before,.st.cur:before{background:var(--acc)}
.st i{position:relative;display:block;width:28px;height:28px;border-radius:50%;margin:0 auto 6px;background:var(--panel);border:3px solid var(--line)}
.st.done i{background:var(--acc);border-color:var(--acc)}.st.cur i{border-color:var(--acc);box-shadow:0 0 0 5px var(--accsoft)}
.st span{font-size:13px;font-weight:600}.st.cur span{color:var(--acc)}
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:9px 14px;border-bottom:3px solid transparent;font-weight:600;color:var(--mute)}
.tab.on{color:var(--ink);border-color:var(--acc)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}.row .t{flex:1;min-width:160px}.row .t.d{text-decoration:line-through;color:var(--mute)}
.row small{color:var(--mute);overflow-wrap:anywhere}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:4px 10px;font-size:13px}
.x{background:none;border:0;color:var(--mute);font-size:18px;line-height:1}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.form{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.form input[type=text]{flex:1;min-width:150px}
.warnbox{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.ins{border-left:4px solid var(--line);padding:8px 14px;margin-bottom:10px;background:var(--bg);border-radius:0 8px 8px 0}
.ins.High{border-color:var(--bad)}.ins.Medium{border-color:var(--warn)}.ins.Low{border-color:var(--ok)}
.ins p{margin:2px 0;color:var(--mute)}.ins .a{color:var(--ink)}
.retro{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.retro div p{background:var(--bg);border-radius:8px;padding:8px 10px;margin:0 0 8px}
.empty{color:var(--mute);padding:10px 0}
.big{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;align-items:center}aside h1{display:none}.pbtn,.home{width:auto;white-space:nowrap;flex:none}.pbtn small{display:none}}
.app.solo{grid-template-columns:1fr}.app.solo aside{display:none}.app.solo main{max-width:none;padding:0}.lg{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}.lgl{background:#16275a;color:#fff;padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:center;gap:18px}.lgb{font-size:34px;font-weight:700;letter-spacing:-.03em}.lgt{font-size:18px;max-width:30ch;margin:0;color:#c9d4f5}.lgs{list-style:none;margin:28px 0 0;padding:0}.lgs li{position:relative;padding:0 0 22px 34px;font-weight:600;color:#8fa3de}.lgs li:before{content:"";position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;border:3px solid #5b73c4;background:#16275a}.lgs li:after{content:"";position:absolute;left:9px;top:22px;width:3px;height:calc(100% - 20px);background:#5b73c4}.lgs li:last-child:after{display:none}.lgs li.d{color:#fff}.lgs li.d:before{background:#fff;border-color:#fff}.lgs li.d:after{background:#fff}.lgr{display:flex;align-items:center;justify-content:center;padding:32px 20px}.lgf{width:100%;max-width:340px}.av{width:60px;height:60px;border-radius:50%;background:var(--accsoft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;margin-bottom:18px}.lgf .sub{margin-bottom:18px}.pin{width:100%;font-size:26px;letter-spacing:.4em;text-align:center;padding:12px;margin-bottom:12px}.btn.wide{width:100%;padding:12px}.app.solo main{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}.lg{width:100%;max-width:820px;min-height:0;grid-template-columns:1fr 1fr;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}.lgl{padding:40px 36px}.lgf{text-align:center}.av{margin:0 auto 18px}.lgr{padding:40px 32px}@media(max-width:760px){.lg{grid-template-columns:1fr}.lgl{min-height:0;padding:28px 24px}.lgs{display:none}}
</style>
</head>

var VK="tp-vault",NK="tp-name",LK="tp-lock",S=null,CK=null,UNLOCKED=false,PERR="",MSG="",MOK=true,SQ=Promise.resolve(),IDLE=null,ENC=new TextEncoder(),DEC=new TextDecoder();
function gs(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function rm(k){try{localStorage.removeItem(k)}catch(e){}}
var NAME=gs(NK)||"";
function hasV(){return !!gs(VK)}
function fresh(){return{sel:null,tab:"tasks",projects:[]}}
function b64(u){var s="";u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function unb64(t){var b=atob(t),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function derive(pin,salt){var k=await crypto.subtle.importKey("raw",ENC.encode(pin),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:310000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function seal(){if(!CK||!S)return;var iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},CK,ENC.encode(JSON.stringify(S)));try{var v=JSON.parse(gs(VK));v.iv=b64(iv);v.d=b64(ct);ss(VK,JSON.stringify(v))}catch(e){}}
function save(){if(CK)SQ=SQ.then(seal).catch(function(){})}
async function tryUnlock(pin){var v=JSON.parse(gs(VK)),k=await derive(pin,unb64(v.s));try{var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(v.iv)},k,unb64(v.d));S=JSON.parse(DEC.decode(pt));CK=k;return true}catch(e){return false}}
async function setup(pin){var salt=crypto.getRandomValues(new Uint8Array(16)),old=null;try{old=JSON.parse(gs(KEY))}catch(e){}S=old&&old.projects?old:fresh();CK=await derive(pin,salt);if(!ss(VK,JSON.stringify({s:b64(salt)})))throw 1;await seal();rm(KEY);rm("improwiser-pin")}
function lockInfo(){try{return JSON.parse(gs(LK))||{n:0,t:0}}catch(e){return{n:0,t:0}}}
function failed(){var L=lockInfo();L.n++;L.t=L.n>=3?Date.now()+Math.min(300000,5000*Math.pow(2,L.n-3)):0;ss(LK,JSON.stringify(L))}
async function doLogin(){var pn=val("lg-n"),w=lockInfo().t-Date.now();
if(w>0){PERR="Too many attempts. Wait "+Math.ceil(w/1000)+" seconds.";return render()}
if(!window.crypto||!crypto.subtle){PERR="This browser cannot encrypt data. Open TaskPulse over https.";return render()}
try{if(hasV()){if(await tryUnlock(pn)){rm(LK);UNLOCKED=true;PERR=""}else{failed();PERR="Wrong PIN. Try again."}}
else if(pn.length<6)PERR="Use at least 6 characters.";
else{await setup(pn);UNLOCKED=true;PERR=""}}catch(e){PERR="Could not unlock. Check that browser storage is allowed."}
if(UNLOCKED){if(S.name){NAME=S.name;ss(NK,NAME)}bump()}render()}
async function doPin(){var pc=val("pn-c"),pw=val("pn-n");try{var v=JSON.parse(gs(VK)),k=await derive(pc,unb64(v.s));try{await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(v.iv)},k,unb64(v.d))}catch(e){MSG="Current PIN is wrong.";MOK=false;return render()}
if(pw.length<6){MSG="New PIN needs at least 6 characters.";MOK=false;return render()}
var salt=crypto.getRandomValues(new Uint8Array(16));CK=await derive(pw,salt);v.s=b64(salt);ss(VK,JSON.stringify(v));await seal();MSG="PIN changed.";MOK=true}catch(e){MSG="Could not change PIN.";MOK=false}render()}
function lock(){CK=null;S=null;UNLOCKED=false;PERR="";clearTimeout(IDLE);render()}
function bump(){clearTimeout(IDLE);if(UNLOCKED)IDLE=setTimeout(lock,300000)}
function wipe(){rm(VK);rm(NK);rm(LK);rm(KEY);rm("improwiser-pin");NAME="";lock()}
function uid(){return Math.random().toString(36).slice(2,10)}
function iso(d){var x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function P(id){return S.projects.filter(function(p){return p.id===id})[0]}
function daysLeft(p){return p.deadline?Math.ceil((new Date(p.deadline+"T23:59:59")-new Date())/864e5):null}
// ---- TaskPulse rule engine ----
function velocity(p){return p.tasks.length?Math.round(p.tasks.filter(function(t){return t.status==="Completed"}).length/p.tasks.length*100):0}
function bottlenecks(p){return p.tasks.filter(function(t){return t.status==="In Progress"&&t.stuck>5})}
function pendingHigh(p){return p.tasks.filter(function(t){return t.priority==="High"&&t.status!=="Completed"})}
function health(p){var d=daysLeft(p);if(p.stage!=="Closure"&&p.stage!=="Monitor"&&d!==null&&d<0)return"Delayed";if(d!==null&&d<7&&p.tasks.length&&velocity(p)<40)return"At Risk";return"On Track"}
function insights(p){var out=[],v=velocity(p),d=daysLeft(p);
bottlenecks(p).forEach(function(t){out.push({type:"Bottleneck",sev:"High",title:"“"+t.title+"” is stuck",desc:"In progress for "+t.stuck+" days"+".",act:"Check what is blocking it, or reassign it today."})});
if(health(p)==="At Risk")out.push({type:"Velocity",sev:"High",title:"Deadline at risk",desc:"Only "+v+"% of tasks are done and "+d+" day(s) remain.",act:"Cut scope or add people to the remaining tasks."});
if(health(p)==="Delayed")out.push({type:"Velocity",sev:"High",title:"Deadline passed",desc:"The target date was "+Math.abs(d)+" day(s) ago.",act:"Set a new deadline and review what slipped."});
var ph=pendingHigh(p);if(ph.length&&p.stage!=="Closure"&&p.stage!=="Monitor")out.push({type:"Efficiency",sev:"Medium",title:ph.length+" high-priority task(s) open",desc:"These must be done before the project can move to Closure.",act:"Finish them first: "+ph.map(function(t){return t.title}).join(", ")+"."});
if(!out.length)out.push({type:"Efficiency",sev:"Low",title:"No bottlenecks found",desc:"Velocity is "+v+"% and nothing is stuck.",act:"Keep going."});
return out}
function pill(h){return'<span class="pill '+(h==="On Track"?"ok":h==="At Risk"?"warn":"bad")+'">'+h+"</span>"}
// ---- views ----
function render(){var app=document.querySelector(".app");if(!UNLOCKED){app.className="app solo";document.getElementById("main").innerHTML='<div class="lg"><div class="lgl"><div class="lgb"><img class="lm2" src="'+LOGO+'" alt="">TaskPulse</div><p class="lgt">Every project, from first idea to final check-in.</p><ol class="lgs">'+STAGES.map(function(g,i){return"<li"+(i<4?' class="d"':"")+">"+g+"</li>"}).join("")+'</ol></div><div class="lgr"><div class="lgf"><div class="av">'+(NAME?esc(NAME.charAt(0).toUpperCase()):LOCK)+'</div><h2>'+(NAME?'Hello, '+esc(NAME):(hasV()?"Enter your PIN":"Create a PIN"))+'</h2><p class="sub">'+(hasV()?"Enter your PIN to unlock TaskPulse.":"Choose a PIN of at least 6 characters. It encrypts your data on this device and cannot be recovered if you forget it.")+'</p><input class="pin" type="password" inputmode="numeric" id="lg-n" placeholder="PIN" autocomplete="off" autofocus>'+(PERR?'<p style="color:var(--bad);margin:0 0 10px">'+PERR+'</p>':"")+'<button class="btn wide" data-a="login">'+(hasV()?"Unlock":"Save PIN")+'</button>'+(hasV()?'<p style="margin:14px 0 0"><button class="btn g s" data-a="wipe">Forgot PIN? Erase all data</button></p>':"")+'</div></div></div>';return}app.className="app";var s='<h1><img class="lm" src="'+LOGO+'" alt="">TaskPulse</h1><button class="home'+(S.view?"":" on")+'" data-a="home">Dashboard</button><button class="home'+(S.view==="new"&&!S.sel?" on":"")+'" data-a="newproj">New project</button><button class="home'+(S.view==="me"&&!S.sel?" on":"")+'" data-a="me">Personal details</button>';

s+='<div style="margin-top:auto;padding:10px;color:var(--mute);font-size:13px"><b style="color:var(--ink)">'+esc(S.name||"")+'</b><br><button class="btn g s" style="margin-top:6px" data-a="logout">Log out</button> </div>';document.getElementById("side").innerHTML=s;
document.getElementById("main").innerHTML=S.sel&&P(S.sel)?detail(P(S.sel)):S.view==="new"?newView():S.view==="me"?meView():dash();save()}
function dash(){var ps=S.projects,b=0,r=0,vs=0;ps.forEach(function(p){b+=bottlenecks(p).length;if(health(p)!=="On Track")r++;vs+=velocity(p)});
var s=(S.name?'<h2>Hello, '+esc(S.name)+'</h2>':'<h2>Dashboard</h2>')+'<p class="sub">All projects, their health and where they are stuck.</p>'+(S.name?'':'<div class="card"><h3>Your name</h3><div class="form" style="margin-top:0"><input type="text" id="nm-n" placeholder="Enter your name"><button class="btn" data-a="savename">Save name</button></div></div>')+'<div class="metrics">'+
m("Projects",ps.length)+m("Average velocity",(ps.length?Math.round(vs/ps.length):0)+"%")+m("Open bottlenecks",b)+m("At risk or delayed",r)+'</div><div class="grid">';
ps.forEach(function(p){var d=daysLeft(p);s+='<div class="pcw"><button class="pc" data-a="open" data-id="'+p.id+'">'+pill(health(p))+'<h3 style="margin:8px 0 2px">'+esc(p.title)+'</h3><small style="color:var(--mute)">'+esc(p.category||"General")+'</small><div class="bar"><i style="width:'+velocity(p)+'%"></i></div><small style="color:var(--mute)">'+velocity(p)+"% done · "+p.stage+(d!==null?" · "+(d<0?Math.abs(d)+" days overdue":d+" days left"):"")+"</small></button>"+dlinks(p)+"</div>"});
if(!ps.length)s+='<p class="empty">No projects yet. Use New project in the sidebar to add one.</p>';
s+='</div>';
return s}
function newView(){return'<h2>New project</h2><p class="sub">Start a project. You can add tasks next.</p><div class="card"><div class="form" style="margin-top:0;flex-direction:column;align-items:stretch"><input type="text" id="np-t" placeholder="Project title"><input type="text" id="np-c" placeholder="Category"><input type="text" id="np-x" placeholder="Short description (optional)"><input type="date" id="np-d" aria-label="Target deadline"><button class="btn" data-a="addproj">Add project</button></div></div>'}
function meView(){var msg=MSG,ok=MOK;MSG="";return'<h2>Personal details</h2><p class="sub">Change your name or PIN.</p>'+(msg?'<div class="warnbox" style="'+(ok?'background:var(--okbg);color:var(--ok);border-color:var(--ok)':'')+'">'+esc(msg)+'</div>':"")+'<div class="card"><h3>Name</h3><div class="form" style="margin-top:0"><input type="text" id="nm-n" value="'+esc(S.name||"")+'" placeholder="Your name"><button class="btn" data-a="savename">Save name</button></div></div><div class="card"><h3>PIN</h3><div class="form" style="margin-top:0"><input type="password" id="pn-c" placeholder="Current PIN" autocomplete="off"><input type="password" id="pn-n" placeholder="New PIN (6+ characters)" autocomplete="off"><button class="btn" data-a="savepin">Change PIN</button></div></div>'}
function dlinks(p){var L=p.links||[];if(!L.length)return"";return'<div class="pls">'+L.map(function(l){return'<a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+esc(l.title)+'</a>'}).join("")+"</div>"}
function m(l,v){return'<div class="m"><span>'+l+"</span><b>"+v+"</b></div>"}
function detail(p){var d=daysLeft(p),ci=STAGES.indexOf(p.stage);
var s='<h2>'+esc(p.title)+'</h2><p class="sub">'+pill(health(p))+" "+esc(p.category||"General")+(d!==null?" · Due "+p.deadline+" ("+(d<0?Math.abs(d)+" days overdue":d+" days left")+")":"")+(p.description?"<br>"+esc(p.description):"")+"</p>";
if(S.warn)s+='<div class="warnbox">'+esc(S.warn)+"</div>";
s+='<div class="card"><h3>Lifecycle</h3><div class="track">';
STAGES.forEach(function(g,i){s+='<button class="st '+(i<ci?"done":i===ci?"cur":"")+'" data-a="stage" data-s="'+g+'"><i></i><span>'+g+"</span></button>"});
s+='</div></div>'+closeCard(p)+'<div class="tabs"><button class="tab'+(S.tab==="tasks"?" on":"")+'" data-a="tab" data-t="tasks">Tasks</button><button class="tab'+(S.tab==="imp"?" on":"")+'" data-a="tab" data-t="imp">Insights</button><button class="tab'+(S.tab==="links"?" on":"")+'" data-a="tab" data-t="links">Links</button></div>';
s+=S.tab==="tasks"?tasks(p):S.tab==="links"?links(p):imp(p);
s+='<p><button class="btn g s" data-a="delproj">Delete project</button></p>';return s}
function closeCard(p){if(p.stage!=="Closure"&&p.stage!=="Monitor")return"";var tot=p.tasks.length,dn=p.tasks.filter(function(t){return t.status==="Completed"}).length,open=tot-dn;var s='<div class="card"><h3>'+(p.stage==="Closure"?"Project closure":"Monitoring")+'</h3><p style="margin:0 0 6px">'+dn+" of "+tot+" tasks completed ("+velocity(p)+"%)"+(p.closedOn?", closed on "+p.closedOn:"")+".</p>"+(open?'<p style="margin:0;color:var(--mute)">'+open+" task(s) still open. Finish or delete them to close cleanly.</p>":p.stage==="Closure"?'<p style="margin:0;color:var(--mute)">All tasks are done. Add your lessons under TaskPulse, then move to Monitor.</p>':"");if(p.stage==="Monitor"){var ck=(p.checks||[]).slice().reverse();s+='<div style="margin-top:12px">';ck.forEach(function(c){s+='<div class="row" data-id="'+c.id+'"><span class="pill '+(c.status==="Healthy"?"ok":c.status==="Watch"?"warn":"bad")+'">'+c.status+'</span><span class="t">'+esc(c.note)+'<br><small>'+c.date+'</small></span><button class="x" data-a="delcheck" aria-label="Delete check">×</button></div>'});if(!ck.length)s+='<p class="empty">No check-ins yet. Log how things are going after closure.</p>';s+='<div class="form"><select id="mc-s"><option>Healthy</option><option>Watch</option><option>Issue</option></select><input type="text" id="mc-n" placeholder="What did you check?"><button class="btn" data-a="addcheck">Log check</button></div></div>'}return s+"</div>"}
function tasks(p){var s='<div class="card"><h3>Tasks ('+p.tasks.length+')</h3>';
p.tasks.forEach(function(t){var done=t.status==="Completed";
s+='<div class="row" data-id="'+t.id+'"><input type="checkbox" data-a="toggle" '+(done?"checked":"")+' aria-label="Mark complete"><span class="t'+(done?" d":"")+'">'+esc(t.title)+'</span>'+
'<span class="pill '+(t.priority==="High"?"bad":t.priority==="Medium"?"warn":"n")+'">'+t.priority+'</span>'+
'<button class="btn g s" data-a="status" title="Change status">'+t.status+"</button>"+
(t.status==="In Progress"?'<button class="btn g s" data-a="stuck" title="Add a stuck day">'+t.stuck+'d stuck +1</button>':"")+
'<button class="x" data-a="deltask" aria-label="Delete task">×</button></div>'});
if(!p.tasks.length)s+='<p class="empty">No tasks yet. Add one below.</p>';
s+='<div class="form"><input type="text" id="nt-t" placeholder="New task"><select id="nt-p"><option>Low</option><option selected>Medium</option><option>High</option></select><button class="btn" data-a="addtask">Add task</button></div></div>';return s}
function links(p){var L=p.links||[],s='<div class="card"><h3>Links ('+L.length+')</h3>';L.forEach(function(l){s+='<div class="row" data-id="'+l.id+'"><span class="t"><a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer" style="color:var(--acc);font-weight:600">'+esc(l.title)+'</a><br><small>'+esc(l.url)+'</small></span><button class="x" data-a="dellink" aria-label="Delete link">×</button></div>'});if(!L.length)s+='<p class="empty">No links yet. Add docs, folders or pages for this project below.</p>';s+='<div class="form"><input type="text" id="ln-t" placeholder="Link name"><input type="text" id="ln-u" placeholder="https://example.com"><button class="btn" data-a="addlink">Add link</button></div></div>';return s}
function imp(p){var v=velocity(p),s='<div class="card"><h3>Velocity</h3><div class="big">'+v+'%</div><div class="bar"><i style="width:'+v+'%"></i></div><small style="color:var(--mute)">Completed tasks divided by total tasks</small></div><div class="card"><h3>Insights</h3>';
insights(p).forEach(function(i){s+='<div class="ins '+i.sev+'"><b>'+esc(i.title)+'</b> <span class="pill n">'+i.type+"</span><p>"+esc(i.desc)+'</p><p class="a">'+esc(i.act)+"</p></div>"});
s+='</div><div class="card"><h3>Retrospective</h3><div class="retro">';
[["Positive","What went well"],["Improvement","What to improve"],["Action","Actions"]].forEach(function(g){s+="<div><b>"+g[1]+"</b><br><br>";
p.notes.filter(function(n){return n.type===g[0]}).forEach(function(n){s+='<p data-id="'+n.id+'">'+esc(n.content)+' <button class="x" data-a="delnote" aria-label="Delete note">×</button></p>'});s+="</div>"});
s+='</div><div class="form"><select id="nn-t"><option>Positive</option><option>Improvement</option><option>Action</option></select><input type="text" id="nn-c" placeholder="Add a retrospective note"><button class="btn" data-a="addnote">Add note</button></div></div>';return s}
// ---- actions ----
function val(id){var e=document.getElementById(id);return e?e.value.trim():""}
document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el||el.type==="checkbox")return;act(el,e)});
document.addEventListener("change",function(e){if(e.target.type==="checkbox"&&e.target.dataset.a)act(e.target,e)});
function act(el){var a=el.dataset.a;if(a==="login"){doLogin();return}if(a==="wipe"){if(confirm("Erase all TaskPulse data on this device? This cannot be undone."))wipe();return}if(!S)return;var p=S.sel?P(S.sel):null,row=el.closest?el.closest("[data-id]"):null,id=row?row.dataset.id:null,t=p&&id?p.tasks.filter(function(x){return x.id===id})[0]:null;
if(a==="logout"){lock();return}
else if(a==="savename"){var nn=val("nm-n");if(!nn)return;S.name=nn;NAME=nn;ss(NK,nn);MSG="Name saved.";MOK=true}
else if(a==="newproj"){S.sel=null;S.view="new";S.warn=""}
else if(a==="me"){S.sel=null;S.view="me";MSG=""}
else if(a==="savepin"){doPin();return}
else if(a==="home"){S.sel=null;S.view="";S.warn=""}
else if(a==="open"){S.sel=el.dataset.id;S.view="";S.warn="";S.tab="tasks"}
else if(a==="tab")S.tab=el.dataset.t;
else if(a==="addproj"){var ti=val("np-t");if(!ti)return;var np={id:uid(),title:ti,category:val("np-c"),stage:"Ideation",deadline:val("np-d"),description:val("np-x"),tasks:[],notes:[]};S.projects.push(np);S.sel=np.id;S.view="";S.tab="tasks"}
else if(a==="delproj"){if(!confirm("Delete this project and all its tasks?"))return;S.projects=S.projects.filter(function(x){return x.id!==p.id});S.sel=null}
else if(a==="stage"){var g=el.dataset.s;S.warn="";
if((g==="Closure"||g==="Monitor")&&pendingHigh(p).length)S.warn="TaskPulse blocked this move: "+pendingHigh(p).length+" high-priority task(s) are still open ("+pendingHigh(p).map(function(x){return x.title}).join(", ")+"). Finish them before closing the project.";
else{p.stage=g;if(g==="Closure"&&!p.closedOn)p.closedOn=iso(0);if(g!=="Closure"&&g!=="Monitor")p.closedOn=""}}
else if(a==="addtask"){var tt=val("nt-t");if(!tt)return;p.tasks.push({id:uid(),title:tt,status:"Pending",priority:document.getElementById("nt-p").value,stuck:0})}
else if(a==="toggle"&&t){t.status=t.status==="Completed"?"Pending":"Completed";t.stuck=0}
else if(a==="status"&&t){t.status=STATUS[(STATUS.indexOf(t.status)+1)%3];t.stuck=0}
else if(a==="stuck"&&t)t.stuck++;
else if(a==="deltask"&&t)p.tasks=p.tasks.filter(function(x){return x!==t});
else if(a==="addcheck"){var cn=val("mc-n");if(!cn)return;p.checks=p.checks||[];p.checks.push({id:uid(),status:document.getElementById("mc-s").value,note:cn,date:iso(0)})}
else if(a==="delcheck")p.checks=(p.checks||[]).filter(function(c){return c.id!==id});
else if(a==="addlink"){var lu=val("ln-u"),lt=val("ln-t"),uo,bad=false;if(!lu)return;if(lu.indexOf("://")<0)lu="https://"+lu;try{uo=new URL(lu);if(uo.protocol!=="http:"&&uo.protocol!=="https:")throw 1}catch(e){bad=true}if(bad)S.warn="Enter a valid web address, like https://example.com.";else{p.links=p.links||[];p.links.push({id:uid(),title:lt||uo.hostname,url:uo.href});S.warn=""}}
else if(a==="dellink")p.links=(p.links||[]).filter(function(l){return l.id!==id});
else if(a==="addnote"){var c=val("nn-c");if(!c)return;p.notes.push({id:uid(),type:document.getElementById("nn-t").value,content:c})}
else if(a==="delnote")p.notes=p.notes.filter(function(n){return n.id!==id});
render()}
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="lg-n"){act({dataset:{a:"login"}})}});
["click","keydown","touchstart","mousemove"].forEach(function(n){document.addEventListener(n,bump,{passive:true})});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
render();
</script>
</body>
</html>
